<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiAvatarBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="aiBotGrad" x1="32" y1="28" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="40" y1="48" x2="88" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#aiAvatarBg)"/>
  <!-- Antenna -->
  <path d="M64 26V16" stroke="#6366F1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="14" r="5" fill="#8B5CF6"/>
  <!-- Head -->
  <rect x="28" y="28" width="72" height="64" rx="20" fill="url(#aiBotGrad)"/>
  <!-- Visor -->
  <rect x="38" y="44" width="52" height="28" rx="12" fill="url(#visorGrad)"/>
  <!-- Glowing Eyes -->
  <circle cx="52" cy="58" r="5" fill="#38BDF8"/>
  <circle cx="53.5" cy="56.5" r="1.8" fill="white"/>
  <circle cx="76" cy="58" r="5" fill="#38BDF8"/>
  <circle cx="77.5" cy="56.5" r="1.8" fill="white"/>
  <!-- Smile/Status indicator -->
  <rect x="54" y="80" width="20" height="4" rx="2" fill="white" fill-opacity="0.8"/>
  <!-- Neck/Base -->
  <rect x="48" y="96" width="32" height="10" rx="5" fill="#818CF8"/>
</svg>
