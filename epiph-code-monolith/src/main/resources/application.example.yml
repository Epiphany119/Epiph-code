spring:
  profiles:
    active: ai
  application:
    name: epiph-code
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${EPIPH_CODE_DB_URL:jdbc:mysql://localhost:3306/epiph_code}
    username: ${EPIPH_CODE_DB_USERNAME:root}
    password: ${EPIPH_CODE_DB_PASSWORD:your_db_password}
  data:
    redis:
      host: ${EPIPH_CODE_REDIS_HOST:127.0.0.1}
      port: ${EPIPH_CODE_REDIS_PORT:6379}
      password: ${EPIPH_CODE_REDIS_PASSWORD:}
      ttl: 3600
  session:
    store-type: redis
    timeout: 2592000

app:
  # 本机开发默认走后端静态资源接口；部署到服务器时改为用户可访问的域名和路径
  deploy-base-url: ${EPIPH_CODE_DEPLOY_BASE_URL:http://localhost:8123/api/static}

server:
  port: ${EPIPH_CODE_SERVER_PORT:8123}
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ai.epiphcode.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

cos:
  client:
    host: ${EPIPH_CODE_COS_HOST:https://your-bucket.cos.ap-shanghai.myqcloud.com}
    secretId: ${EPIPH_CODE_COS_SECRET_ID:your_cos_secret_id}
    secretKey: ${EPIPH_CODE_COS_SECRET_KEY:your_cos_secret_key}
    region: ${EPIPH_CODE_COS_REGION:ap-shanghai}
    bucket: ${EPIPH_CODE_COS_BUCKET:your-bucket-name}

pexels:
  api-key: ${EPIPH_CODE_PEXELS_API_KEY:your_pexels_api_key}

dashscope:
  api-key: ${EPIPH_CODE_DASHSCOPE_API_KEY:your_dashscope_api_key}
  base-url: ${EPIPH_CODE_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
  image-model: ${EPIPH_CODE_DASHSCOPE_IMAGE_MODEL:wan2.6-t2i}
